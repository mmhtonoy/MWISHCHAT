<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MWISH</title>
<style>
:root{--blue:#1877f2;--blue2:#0866ff;--bg:#f0f2f5;--line:#e4e6eb;--text:#172033;--muted:#65676b;--green:#d9fdd3}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{border:0;cursor:pointer}a{color:var(--blue);font-weight:700;text-decoration:none}.hidden{display:none!important}
svg{width:22px;height:22px;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.auth{min-height:100dvh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#071b45,#1877f2)}.authCard{width:min(430px,94vw);background:#fff;border-radius:22px;padding:28px;box-shadow:0 20px 70px #0005}.logo{font-weight:950;letter-spacing:5px;font-size:32px}.tag{color:#65676b;margin:5px 0 24px}.err{display:none;background:#fff1f2;color:#b42318;padding:11px 13px;border-radius:11px;margin:10px 0}.field{margin:12px 0}.field label{font-size:13px;font-weight:800;display:block;margin-bottom:6px}.inputWrap{position:relative}.field input,.field textarea{width:100%;border:1px solid #ccd0d5;border-radius:10px;padding:13px;outline:0;background:#fff}.field textarea{min-height:90px;resize:vertical}.inputWrap input{padding-right:46px}.eye{position:absolute;right:5px;top:4px;width:40px;height:40px;background:transparent;border-radius:50%;display:grid;place-items:center;color:#65676b}.primary{width:100%;background:var(--blue);color:#fff;padding:13px;border-radius:10px;font-weight:800}.secondary{background:#e7f3ff;color:#0866ff;padding:11px 14px;border-radius:9px;font-weight:800}.textBtn{background:transparent;color:var(--blue);padding:8px;font-weight:700}.authSwitch{text-align:center;color:#65676b;margin:17px 0 0}
.app{height:100dvh;max-width:1450px;margin:auto;background:#fff;display:flex;overflow:hidden}.sidebar{width:360px;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--line)}.sideTop{height:62px;padding:0 17px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:950;letter-spacing:3px}.topActions{display:flex;gap:2px}.circleBtn{width:40px;height:40px;border-radius:50%;background:transparent;display:grid;place-items:center;color:#172033}.circleBtn:hover{background:#f0f2f5}.search{margin:3px 14px 11px;background:#f0f2f5;border-radius:20px;height:42px;display:flex;align-items:center;padding:0 13px;color:#65676b}.search input{border:0;outline:0;background:transparent;width:100%;padding:9px}.tabs{display:flex;border-bottom:1px solid var(--line)}.tab{flex:1;background:#fff;padding:12px 4px;color:#65676b;font-weight:800;position:relative}.tab.active{color:var(--blue)}.tab.active:after{content:"";position:absolute;height:3px;background:var(--blue);left:0;right:0;bottom:0}.list{flex:1;overflow:auto}.row{display:flex;gap:12px;align-items:center;padding:12px 15px;border-bottom:1px solid #f1f2f4;cursor:pointer}.row:hover,.row.active{background:#f2f6ff}.avatar{width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.avatar.sm{width:42px;height:42px}.avatar.lg{width:92px;height:92px;font-size:28px}.info{min-width:0;flex:1}.name{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:35px 20px;text-align:center;color:#7a8494}.bottom{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:#efeae2}.chatHead{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px}.back{display:none;background:transparent;width:40px;height:40px;border-radius:50%;place-items:center}.headInfo{flex:1;min-width:0}.headName{font-weight:850}.headSub{font-size:12px;color:#65676b}.stories{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:12px;padding:9px 13px;overflow:auto}.story{width:65px;min-width:65px;text-align:center;font-size:11px;cursor:pointer}.story .avatar{margin:auto;width:58px;height:58px;border:2px solid var(--blue)}.story.add .avatar{background:#fff;color:var(--blue);border:2px solid #d0d7e2}.story span{display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.messages{flex:1;overflow:auto;padding:18px 7%;background:#efeae2;background-image:radial-gradient(#d9d2ca 1px,transparent 1px);background-size:18px 18px}.bubble{max-width:min(72%,560px);width:max-content;background:#fff;border-radius:8px;padding:8px 10px;margin:5px 0;box-shadow:0 1px 1px #0001;word-break:break-word}.mine{margin-left:auto;background:var(--green)}.bubble img,.bubble video{max-width:320px;border-radius:7px;display:block}.meta{font-size:10px;color:#7a8494;text-align:right;margin-top:3px}.composer{background:#f0f2f5;padding:8px 10px;display:flex;align-items:center;gap:7px}.composeInput{flex:1;background:#fff;border-radius:22px;padding:0 15px}.composeInput input{border:0;outline:0;width:100%;padding:12px 0}.sendBtn,.micBtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}.sendBtn{background:var(--blue);color:#fff}.micBtn{background:transparent;color:var(--blue)}.recording{background:#fee2e2;color:#b42318}.attachBtn{width:42px;height:42px;border-radius:50%;background:transparent;color:#65676b;display:grid;place-items:center}
.modal{position:fixed;inset:0;background:#0007;z-index:50;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:min(620px,100%);max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}.modalTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modalTop h2{margin:0}.close{width:38px;height:38px;border-radius:50%;background:#f0f2f5;display:grid;place-items:center}.menuItem{width:100%;display:flex;align-items:center;gap:13px;padding:14px 8px;background:#fff;text-align:left;border-bottom:1px solid #f0f2f4;font-weight:750}.menuItem svg{color:#344054}.danger{color:#b42318}.profile{text-align:center}.profile .avatar{margin:0 auto}.profile h2{margin-bottom:2px}.detail{text-align:left;border-top:1px solid var(--line);padding:13px 0}.detail b{font-size:12px;color:#65676b}.detail p{margin:4px 0 0}.rowBtns{display:flex;gap:8px}.rowBtns>*{flex:1}.file{display:none}.preview{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:10px auto}.storyText{font-size:18px;line-height:1.55}.storyAuthor{display:flex;align-items:center;gap:10px;margin-bottom:15px}.emailBox{background:#f5f6f7;border-radius:12px;padding:14px;margin:10px 0}
@media(max-width:760px){.app{height:100dvh}.sidebar{width:100%;border:0}.main{display:none}.app.chatOpen .sidebar{display:none}.app.chatOpen .main{display:flex;width:100%}.back{display:grid}.bottom{display:flex;border-top:1px solid var(--line);background:#fff}.bottom button{flex:1;background:#fff;color:#65676b;padding:8px 3px;font-size:11px}.bottom button.active{color:var(--blue)}.bottom svg{margin:auto}.stories{padding:8px 10px}.messages{padding:13px 4%}.bubble{max-width:84%}.bubble img,.bubble video{max-width:250px}.modal{align-items:flex-end}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendEmailVerification,sendPasswordResetEmail,signOut,updatePassword,updateEmail,reauthenticateWithCredential,EmailAuthProvider,updateProfile as authUpdateProfile} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,updateDoc,collection,query,where,orderBy,onSnapshot,addDoc,serverTimestamp,arrayRemove,limit,getDocs} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyBtV4aPEbyHKxUaRHMbFdRAeoSwAuPUejw",authDomain:"mwish-9fc56.firebaseapp.com",projectId:"mwish-9fc56",storageBucket:"mwish-9fc56.firebasestorage.app",messagingSenderId:"836890845919",appId:"1:836890845919:web:2901d76ee61e2951fabf6a"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const CLOUDINARY_CLOUD_NAME="PASTE_CLOUDINARY_CLOUD_NAME";
const CLOUDINARY_UPLOAD_PRESET="PASTE_UNSIGNED_UPLOAD_PRESET";
async function uploadMedia(file,folder){
 if(CLOUDINARY_CLOUD_NAME.startsWith("PASTE_")||CLOUDINARY_UPLOAD_PRESET.startsWith("PASTE_")) throw new Error("Cloudinary is not configured yet. Add your Cloud Name and unsigned Upload Preset in index.html.");
 const form=new FormData(); form.append("file",file); form.append("upload_preset",CLOUDINARY_UPLOAD_PRESET); if(folder) form.append("folder",folder);
 const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`,{method:"POST",body:form});
 const data=await res.json(); if(!res.ok) throw new Error(data.error?.message||"Media upload failed");
 return {url:data.secure_url,resourceType:data.resource_type,format:data.format};
}
let me=null,active=null,msgUnsub=null,groupUnsub=null,storyUnsub=null,recorder=null,recChunks=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const initials=n=>(n||"?").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
const ico=n=>({search:`<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>`,plus:`<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>`,more:`<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>`,back:`<svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>`,send:`<svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>`,mic:`<svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"></path></svg>`,image:`<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8.5" cy="9" r="1.5"></circle><path d="m21 15-5-5L5 20"></path></svg>`,eye:`<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>`,user:`<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>`,settings:`<svg viewBox="0 0 24 24"><path d="M12 2v3M12 19v3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M2 12h3M19 12h3M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"></path><circle cx="12" cy="12" r="4"></circle></svg>`,lock:`<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>`,mail:`<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>`,group:`<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="10" r="2"></circle><path d="M3 20a6 6 0 0 1 12 0M14 20a5 5 0 0 1 7 0"></path></svg>`,logout:`<svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"></path><path d="M13 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"></path></svg>`,story:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>`}[n]||"");
function av(u,cls=""){return `<div class="avatar ${cls}">${u?.photoURL?`<img src="${esc(u.photoURL)}">`:esc(initials(u?.name||u?.username))}</div>`}
function showModal(title,body){$("modal").classList.add("show");$("sheet").innerHTML=`<div class="modalTop"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div>${body}`}
function closeModal(){$("modal").classList.remove("show")}window.closeModal=closeModal;
function err(t){const e=$("authErr");if(e){e.style.display="block";e.textContent=t}}
function passField(id,label,autocomplete){return `<div class="field"><label>${label}</label><div class="inputWrap"><input id="${id}" type="password" autocomplete="${autocomplete||"new-password"}"><button type="button" class="eye" onclick="togglePass('${id}',this)">${ico("eye")}</button></div></div>`}
window.togglePass=(id,b)=>{const x=$(id);x.type=x.type==='password'?'text':'password';b.style.color=x.type==='text'?'#1877f2':'#65676b'};
function authUI(mode="login"){$("root").innerHTML=`<div class="auth"><div class="authCard"><div class="logo">MWISH</div><div class="tag">Social chat, made simple.</div><div id="authErr" class="err"></div><div id="authBody"></div></div></div>`;mode==='login'?loginUI():signupUI()}
function loginUI(){$("authBody").innerHTML=`<h2>Login</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div>${passField("pass","Password","current-password")}<button class="primary" onclick="login()">Login</button><div style="text-align:center;margin-top:9px"><button class="textBtn" onclick="forgotPassword()">Forgot password?</button></div><div class="authSwitch">Don't have an account? <a href="#" onclick="signupUI();return false">Create new account</a></div>`}
function signupUI(){$("authBody").innerHTML=`<h2>Create new account</h2><div class="field"><label>Name</label><input id="name" autocomplete="name"></div><div class="field"><label>Username</label><input id="username" autocomplete="username" placeholder="username"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div>${passField("pass","Password","new-password")}<button class="primary" onclick="signup()">Create account</button><div class="authSwitch">Already have an account? <a href="#" onclick="loginUI();return false">Login</a></div>`}
window.loginUI=()=>authUI("login");window.signupUI=()=>authUI("signup");
window.login=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value)}catch(e){err(e.code==='auth/invalid-credential'?'Incorrect email or password.':e.message)}};
window.signup=async()=>{try{const name=$("name").value.trim(),username=$("username").value.trim().toLowerCase().replace(/^@/,""),email=$("email").value.trim().toLowerCase(),password=$("pass").value;if(!name||!username||!email||password.length<6)return err("Please complete all fields. Password must be at least 6 characters.");if(!/^[a-z0-9._]{3,30}$/.test(username))return err("Username: 3–30 characters, letters, numbers, dot or underscore.");const c=await createUserWithEmailAndPassword(auth,email,password);await authUpdateProfile(c.user,{displayName:name});await setDoc(doc(db,"users",c.user.uid),{uid:c.user.uid,name,username,email,bio:"",about:"",work:"",dob:"",photoURL:"",createdAt:serverTimestamp()});await sendEmailVerification(c.user);await signOut(auth);authUI("login");alert("Verification email sent. Verify your email, then login.")}catch(e){err(e.message)}};
window.forgotPassword=async()=>{const email=prompt("Enter your account email");if(!email)return;try{await sendPasswordResetEmail(auth,email.trim());alert("Password reset email sent. Open the email and follow the reset link.")}catch(e){alert(e.message)}};

onAuthStateChanged(auth,async u=>{if(!u){me=null;authUI("login");return}if(!u.emailVerified){$("root").innerHTML=`<div class="auth"><div class="authCard"><div class="logo">MWISH</div><h2>Verify your email</h2><p class="tag">We sent a verification link to <b>${esc(u.email)}</b>.</p><button class="primary" onclick="resendVerify()">Resend verification email</button><button class="textBtn" style="width:100%;margin-top:8px" onclick="signOut(auth)">Logout</button></div></div>`;return}const d=await getDoc(doc(db,"users",u.uid));me=d.exists()?d.data():{uid:u.uid,name:u.displayName||"User",username:"",email:u.email};renderApp()});
window.resendVerify=async()=>{try{await sendEmailVerification(auth.currentUser);alert("Verification email sent.")}catch(e){alert(e.message)}};window.logout=()=>signOut(auth);window.auth=auth;

function renderApp(){
$("root").innerHTML=`<div class="app" id="app"><aside class="sidebar" id="sidebar"><div class="sideTop"><div class="brand">MWISH</div><div class="topActions"><button class="circleBtn" onclick="newMenu()">${ico("plus")}</button><button class="circleBtn" onclick="settings()">${ico("more")}</button></div></div><div class="search">${ico("search")}<input id="searchInput" placeholder="Search name or username" oninput="searchUsers(this.value)"></div><div class="tabs"><button id="tabChats" class="tab active" onclick="showTab('chats')">Chats</button><button id="tabGroups" class="tab" onclick="showTab('groups')">Groups</button></div><div id="list" class="list"></div><div class="bottom"><button id="navChats" onclick="showTab('chats')">${ico("mail")}<span>Chats</span></button><button id="navStories" onclick="showTab('stories')">${ico("story")}<span>Stories</span></button><button onclick="profile()">${ico("user")}<span>Profile</span></button><button onclick="settings()">${ico("settings")}<span>Settings</span></button></div></aside><main class="main"><div class="chatHead"><button class="back" onclick="backToList()">${ico("back")}</button><div id="headAvatar"></div><div class="headInfo"><div id="title" class="headName">MWISH</div><div id="status" class="headSub">Select a chat to start messaging</div></div><button class="circleBtn" onclick="chatOptions()">${ico("more")}</button></div><div id="stories" class="stories"></div><div id="messages" class="messages"><div class="empty"><b>MWISH</b><br><br>Select a person or group to start chatting.</div></div><div class="composer"><input class="file" id="imageFile" type="file" accept="image/*,video/*" onchange="sendMedia(this.files[0])"><button class="attachBtn" onclick="$(\'imageFile\').click()">${ico("image")}</button><div class="composeInput"><input id="text" placeholder="Message" onkeydown="if(event.key==='Enter')sendMessage()"></div><button id="mic" class="micBtn" onclick="toggleRecording()">${ico("mic")}</button><button class="sendBtn" onclick="sendMessage()">${ico("send")}</button></div></main></div>`;loadStories();loadRecent();}
window.$=$;
function cleanupMsg(){if(msgUnsub){msgUnsub();msgUnsub=null}}
window.backToList=()=>{$("app").classList.remove("chatOpen");active=null;cleanupMsg();$("title").textContent="MWISH";$("status").textContent="Select a chat to start messaging";$("headAvatar").innerHTML=""};
function mobileOpen(){if(innerWidth<=760)$('app').classList.add('chatOpen')}
function showTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(t==='groups')$("tabGroups").classList.add('active');else $("tabChats").classList.add('active');if(t==='groups')loadGroups();else if(t==='stories')loadStoriesList();else loadRecent()}
window.showTab=showTab;
async function loadRecent(){if(!$("list"))return;$("list").innerHTML=`<div class="empty">Search a person by name or username to start a chat.</div>`}
async function searchUsers(term){term=term.trim().toLowerCase();if(!term)return loadRecent();try{const users=[];const a=await getDocs(query(collection(db,"users"),where("username",">=",term),where("username","<=",term+"\uf8ff"),limit(15)));a.forEach(d=>{if(d.id!==auth.currentUser.uid)users.push(d.data())});const b=await getDocs(query(collection(db,"users"),where("name",">=",term),where("name","<=",term+"\uf8ff"),limit(15)));b.forEach(d=>{if(d.id!==auth.currentUser.uid&&!users.some(x=>x.uid===d.id))users.push(d.data())});$("list").innerHTML=users.map(u=>`<div class="row" onclick='openDM(${JSON.stringify(u.uid)},${JSON.stringify(u.name)})'>${av(u)}<div class="info"><div class="name">${esc(u.name)}</div><div class="sub">@${esc(u.username)}</div></div></div>`).join("")||`<div class="empty">No user found.</div>`}catch(e){$("list").innerHTML=`<div class="empty">Search error.<br><small>${esc(e.message)}</small></div>`}}
window.searchUsers=searchUsers;
async function loadGroups(){try{const q=query(collection(db,"groups"),where("members","array-contains",auth.currentUser.uid));onSnapshot(q,s=>{$("list").innerHTML=s.docs.map(d=>{const g=d.data();return `<div class="row" onclick='openGroup(${JSON.stringify(d.id)},${JSON.stringify(g.name)},${JSON.stringify(g.admin)})'><div class="avatar">${ico("group")}</div><div class="info"><div class="name">${esc(g.name)}</div><div class="sub">${g.members.length} members</div></div></div>`}).join("")||`<div class="empty">No groups yet.<br><br><button class="secondary" onclick="groupCreate()">Create group</button></div>`})}catch(e){alert(e.message)}}
function loadStories(){const q=query(collection(db,"stories"),orderBy("createdAt","desc"),limit(30));if(storyUnsub)storyUnsub();storyUnsub=onSnapshot(q,s=>{$("stories").innerHTML=`<div class="story add" onclick="storyCreate()"><div class="avatar">${ico("plus")}</div><span>My story</span></div>`+s.docs.map(d=>{const x=d.data();return `<div class="story" onclick='viewStory(${JSON.stringify(x)})'>${av({name:x.name,photoURL:x.photoURL})}<span>${esc(x.name||"User")}</span></div>`}).join("")})}
async function loadStoriesList(){const s=await getDocs(query(collection(db,"stories"),orderBy("createdAt","desc"),limit(50)));$("list").innerHTML=s.docs.map(d=>{const x=d.data();return `<div class="row" onclick='viewStory(${JSON.stringify(x)})'>${av({name:x.name,photoURL:x.photoURL})}<div class="info"><div class="name">${esc(x.name||"User")}</div><div class="sub">Story</div></div></div>`}).join("")||`<div class="empty">No stories yet.</div>`}
window.viewStory=x=>{showModal("Story",`<div class="storyAuthor">${av({name:x.name,photoURL:x.photoURL})}<div><b>${esc(x.name||"User")}</b></div></div>${x.mediaURL?`<${x.mediaType==='video'?'video controls':'img'} class="preview" src="${esc(x.mediaURL)}"></${x.mediaType==='video'?'video':'img'}>`:''}${x.text?`<div class="storyText">${esc(x.text)}</div>`:''}`)};
window.storyCreate=()=>showModal("Create story",`<div class="field"><label>Text</label><textarea id="storyText" placeholder="What's on your mind?"></textarea></div><input class="file" id="storyFile" type="file" accept="image/*,video/*" onchange="storyPreview(this.files[0])"><button class="secondary" style="width:100%;margin-bottom:10px" onclick="$(\'storyFile\').click()">Add photo or video</button><div id="storyPrev"></div><button class="primary" onclick="publishStory()">Post story</button>`);
window.storyPreview=f=>{if(!f)return;const u=URL.createObjectURL(f);$("storyPrev").innerHTML=f.type.startsWith('video')?`<video class="preview" controls src="${u}"></video>`:`<img class="preview" src="${u}">`};
window.publishStory=async()=>{try{const f=$("storyFile").files[0],text=$("storyText").value.trim();let mediaURL="",mediaType="";if(f){const up=await uploadMedia(f,`stories/${auth.currentUser.uid}`);mediaURL=up.url;mediaType=f.type.startsWith('video')?'video':(f.type.startsWith('audio')?'audio':'image')}if(!text&&!mediaURL)return alert('Add text or a photo/video.');await addDoc(collection(db,"stories"),{uid:auth.currentUser.uid,name:me.name,photoURL:me.photoURL||"",text,mediaURL,mediaType,createdAt:serverTimestamp()});closeModal()}catch(e){alert(e.message)}};
window.openDM=(uid,name)=>{active={type:'dm',uid,name};mobileOpen();$("title").textContent=name;$("status").textContent="Message";$("headAvatar").innerHTML=av({name},"sm");listenDM()};
function listenDM(){cleanupMsg();const room=[auth.currentUser.uid,active.uid].sort().join("_");const q=query(collection(db,"rooms",room,"messages"),orderBy("createdAt","asc"));msgUnsub=onSnapshot(q,s=>renderMessages(s.docs.map(d=>d.data())))}
window.openGroup=(gid,name,admin)=>{active={type:'group',gid,name,admin};mobileOpen();$("title").textContent=name;$("status").textContent="Group";$("headAvatar").innerHTML=`<div class="avatar sm">${ico('group')}</div>`;cleanupMsg();const q=query(collection(db,"groups",gid,"messages"),orderBy("createdAt","asc"));msgUnsub=onSnapshot(q,s=>renderMessages(s.docs.map(d=>d.data()))) };
function renderMessages(items){$("messages").innerHTML=items.length?items.map(m=>{let body=m.text?`<div>${esc(m.text)}</div>`:'';if(m.mediaURL)body+=m.mediaType==='video'?`<video controls src="${esc(m.mediaURL)}"></video>`:m.mediaType==='audio'?`<audio controls src="${esc(m.mediaURL)}"></audio>`:`<img src="${esc(m.mediaURL)}">`;return `<div class="bubble ${m.uid===auth.currentUser.uid?'mine':''}">${body}<div class="meta">${m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'sending…'}</div></div>`}).join(""):`<div class="empty">No messages yet. Start the conversation.</div>`;requestAnimationFrame(()=>{$("messages").scrollTop=$("messages").scrollHeight})}
window.sendMessage=async()=>{const text=$("text").value.trim();if(!text||!active)return;const data={uid:auth.currentUser.uid,text,createdAt:serverTimestamp()};if(active.type==='dm'){const room=[auth.currentUser.uid,active.uid].sort().join("_");await addDoc(collection(db,"rooms",room,"messages"),data)}else await addDoc(collection(db,"groups",active.gid,"messages"),data);$("text").value=""};
window.sendMedia=async f=>{if(!f||!active)return;try{const up=await uploadMedia(f,`messages/${auth.currentUser.uid}`);const data={uid:auth.currentUser.uid,text:"",mediaURL:up.url,mediaType:f.type.startsWith('video')?'video':(f.type.startsWith('audio')?'audio':'image'),createdAt:serverTimestamp()};if(active.type==='dm'){const room=[auth.currentUser.uid,active.uid].sort().join("_");await addDoc(collection(db,"rooms",room,"messages"),data)}else await addDoc(collection(db,"groups",active.gid,"messages"),data)}catch(e){alert(e.message)}};
window.toggleRecording=async()=>{if(recorder&&recorder.state==='recording'){recorder.stop();$("mic").classList.remove('recording');return}if(!navigator.mediaDevices?.getUserMedia)return alert('Voice recording is not supported in this browser preview.');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recChunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>recChunks.push(e.data);recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(recChunks,{type:'audio/webm'});try{const up=await uploadMedia(blob,`voice/${auth.currentUser.uid}`);const data={uid:auth.currentUser.uid,text:"",mediaURL:up.url,mediaType:'audio',createdAt:serverTimestamp()};if(active.type==='dm'){const room=[auth.currentUser.uid,active.uid].sort().join('_');await addDoc(collection(db,'rooms',room,'messages'),data)}else await addDoc(collection(db,'groups',active.gid,'messages'),data)}catch(e){alert('Voice upload failed. Firebase Storage must be enabled.')}};recorder.start();$("mic").classList.add('recording')}catch(e){alert('Microphone permission denied.')}};

window.profile=()=>showModal("Profile",`<div class="profile"><div onclick="changePhoto()" style="cursor:pointer">${av(me,'lg')}</div><h2>${esc(me.name)}</h2><div class="sub">@${esc(me.username)}</div><div class="detail"><b>ABOUT</b><p>${esc(me.about||'Not added')}</p></div><div class="detail"><b>BIO</b><p>${esc(me.bio||'Not added')}</p></div><div class="detail"><b>WORK</b><p>${esc(me.work||'Not added')}</p></div><div class="detail"><b>DATE OF BIRTH</b><p>${esc(me.dob||'Not added')}</p></div><button class="primary" onclick="editProfile()">Edit profile</button></div>`);
window.editProfile=()=>showModal("Edit profile",`<div class="field"><label>Name</label><input id="pn" value="${esc(me.name)}"></div><div class="field"><label>Username</label><input id="pu" value="${esc(me.username)}"></div><div class="field"><label>About</label><textarea id="pa">${esc(me.about)}</textarea></div><div class="field"><label>Bio</label><textarea id="pb">${esc(me.bio)}</textarea></div><div class="field"><label>Work</label><input id="pw" value="${esc(me.work)}"></div><div class="field"><label>Date of birth</label><input id="pd" type="date" value="${esc(me.dob)}"></div><button class="primary" onclick="saveProfile()">Save profile</button>`);
window.saveProfile=async()=>{const username=$("pu").value.trim().toLowerCase().replace(/^@/,"");if(!/^[a-z0-9._]{3,30}$/.test(username))return alert('Invalid username');const patch={name:$("pn").value.trim(),username,about:$("pa").value,bio:$("pb").value,work:$("pw").value,dob:$("pd").value};await updateDoc(doc(db,"users",auth.currentUser.uid),patch);me={...me,...patch};await authUpdateProfile(auth.currentUser,{displayName:me.name});closeModal();renderApp()};
window.changePhoto=()=>showModal("Profile photo",`<input class="file" id="profileFile" type="file" accept="image/*" onchange="profilePhoto(this.files[0])"><button class="secondary" style="width:100%" onclick="$(\'profileFile\').click()">Choose photo</button>`);
window.profilePhoto=async f=>{if(!f)return;try{const up=await uploadMedia(f,`profilePhotos/${auth.currentUser.uid}`);const url=up.url;await updateDoc(doc(db,'users',auth.currentUser.uid),{photoURL:url});await authUpdateProfile(auth.currentUser,{photoURL:url});me.photoURL=url;closeModal();renderApp()}catch(e){alert(e.message)}};
window.settings=()=>showModal("Settings",`<button class="menuItem" onclick="profile()">${ico('user')}<span>Profile</span></button><button class="menuItem" onclick="accountEmail()">${ico('mail')}<span>Account email</span></button><button class="menuItem" onclick="changePassword()">${ico('lock')}<span>Change password</span></button><button class="menuItem danger" onclick="logout()">${ico('logout')}<span>Log out</span></button>`);
window.accountEmail=()=>showModal("Account email",`<div class="emailBox"><b>Current email</b><div style="margin-top:5px">${esc(me.email||auth.currentUser.email)}</div></div><div class="field"><label>New email</label><input id="newEmail" type="email" placeholder="new@email.com"></div><p class="sub">For security, Firebase may ask you to sign in again before changing your email.</p><button class="primary" onclick="changeEmail()">Change email</button>`);
window.changeEmail=async()=>{const email=$("newEmail").value.trim();if(!email)return;try{await updateEmail(auth.currentUser,email);await updateDoc(doc(db,'users',auth.currentUser.uid),{email});me.email=email;alert('Email changed.');closeModal()}catch(e){alert('Email change requires recent login. Log out and log in again, then try again.\n\n'+e.message)}};
window.changePassword=()=>showModal("Change password",`<p class="sub">Use your current password, or send a password-reset link to your email.</p><div class="field"><label>Current password</label>${passField('oldPass','Current password','current-password')}</div>${passField('newPass','New password','new-password')}<button class="primary" onclick="savePassword()">Change password</button><button class="textBtn" style="width:100%;margin-top:8px" onclick="forgotPassword()">Send password reset email</button>`);
window.savePassword=async()=>{const old=$("oldPass").value,n=$("newPass").value;if(n.length<6)return alert('New password must be at least 6 characters.');try{const c=EmailAuthProvider.credential(auth.currentUser.email,old);await reauthenticateWithCredential(auth.currentUser,c);await updatePassword(auth.currentUser,n);alert('Password changed successfully.');closeModal()}catch(e){alert(e.code==='auth/invalid-credential'?'Current password is incorrect.':e.message)}};
window.groupCreate=()=>showModal("Create group",`<div class="field"><label>Group name</label><input id="gname" placeholder="Friends"></div><div class="field"><label>Member usernames</label><input id="gusers" placeholder="rahim,karim"></div><button class="primary" onclick="createGroup()">Create group</button>`);
window.createGroup=async()=>{try{const names=$("gusers").value.split(',').map(x=>x.trim().toLowerCase().replace(/^@/,"")).filter(Boolean),members=[auth.currentUser.uid];for(const n of names){const s=await getDocs(query(collection(db,'users'),where('username','==',n),limit(1)));s.forEach(d=>members.push(d.id))}await addDoc(collection(db,'groups'),{name:$("gname").value.trim()||'MWISH Group',admin:auth.currentUser.uid,members:[...new Set(members)],createdAt:serverTimestamp()});closeModal();showTab('groups')}catch(e){alert(e.message)}};
window.chatOptions=()=>{if(!active)return;showModal(active.type==='group'?active.name:'Chat',active.type==='group'?`<button class="menuItem" onclick="groupInfo()">${ico('group')}<span>Group info</span></button><button class="menuItem danger" onclick="leaveGroup()">${ico('logout')}<span>Leave group</span></button>`:`<button class="menuItem" onclick="openDMProfile()">${ico('user')}<span>View profile</span></button>`)};
window.openDMProfile=async()=>{const d=await getDoc(doc(db,'users',active.uid));if(!d.exists())return;const u=d.data();showModal('Profile',`<div class="profile">${av(u,'lg')}<h2>${esc(u.name)}</h2><div class="sub">@${esc(u.username)}</div><div class="detail"><b>BIO</b><p>${esc(u.bio||u.about||'No bio')}</p></div></div>`)};
window.groupInfo=async()=>{const d=await getDoc(doc(db,'groups',active.gid));if(!d.exists())return;const g=d.data();showModal('Group info',`<p><b>${esc(g.name)}</b></p><p class="sub">${g.members.length} members</p><div>${g.members.map(id=>`<div class="row"><div class="avatar sm">${ico('user')}</div><div class="info"><div class="name">${id===g.admin?'Admin':'Member'}</div><div class="sub">${esc(id)}</div></div></div>`).join('')}</div>`)};
window.leaveGroup=async()=>{const d=await getDoc(doc(db,'groups',active.gid));const g=d.data();if(g.admin===auth.currentUser.uid)return alert('Admin must transfer admin before leaving.');await updateDoc(doc(db,'groups',active.gid),{members:arrayRemove(auth.currentUser.uid)});closeModal();backToList();showTab('groups')};
window.newMenu=()=>showModal('Create',`<button class="menuItem" onclick="groupCreate()">${ico('group')}<span>Create group</span></button><button class="menuItem" onclick="storyCreate()">${ico('story')}<span>Create story</span></button><button class="menuItem" onclick="profile()">${ico('user')}<span>Profile</span></button>`);
</script>
</body>
</html>
